<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04050f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>星际突击</title>
<style>
:root{--u:1px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif;color:#e8f1ff}
button{font-family:inherit}

/* ---------- 游戏容器：手机全屏，桌面居中成竖屏比例 ---------- */
#game{position:fixed;top:0;left:50%;transform:translateX(-50%);height:100vh;height:100dvh;
  width:min(100vw,62vh);width:min(100vw,62dvh);overflow:hidden;background:#04050f;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#safeProbe{position:absolute;left:0;top:0;width:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- 暂停按钮 ---------- */
#pauseBtn{position:absolute;z-index:6;top:calc(var(--u)*10 + env(safe-area-inset-top,0px));right:calc(var(--u)*12 + env(safe-area-inset-right,0px));
  width:calc(var(--u)*42);height:calc(var(--u)*42);border-radius:50%;border:1.5px solid rgba(160,195,255,.5);
  background:rgba(20,30,70,.55);display:none;align-items:center;justify-content:center;gap:calc(var(--u)*5);padding:0;touch-action:none}
#pauseBtn i{display:block;width:calc(var(--u)*5);height:calc(var(--u)*16);border-radius:2px;background:#dbe8ff}
#pauseBtn:active{background:rgba(60,90,190,.7)}
#game[data-state="playing"] #pauseBtn{display:flex}

/* ---------- 虚拟控制 ---------- */
#controls{position:absolute;inset:0;pointer-events:none;z-index:5;display:none}
#game[data-state="playing"] #controls{display:block}
#controls>*{pointer-events:auto;touch-action:none}
#joy{position:absolute;left:calc(var(--u)*6 + env(safe-area-inset-left,0px));bottom:calc(var(--u)*8 + env(safe-area-inset-bottom,0px));
  width:calc(var(--u)*146);height:calc(var(--u)*146);display:grid;place-items:center}
.disc{position:relative;width:calc(var(--u)*114);height:calc(var(--u)*114);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 40%,rgba(120,170,255,.2),rgba(30,50,115,.3) 72%);
  border:2px solid rgba(150,190,255,.42);box-shadow:inset 0 0 22px rgba(80,140,255,.28),0 0 18px rgba(60,120,255,.18)}
.disc::before{content:"";position:absolute;inset:calc(var(--u)*30);border-radius:50%;border:1px dashed rgba(170,200,255,.28)}
.ar{position:absolute;width:0;height:0;opacity:.6;border:solid transparent;border-width:calc(var(--u)*6)}
.ar.u{top:calc(var(--u)*5);left:50%;margin-left:calc(var(--u)*-6);border-top-width:0;border-bottom-color:#d3e3ff}
.ar.d{bottom:calc(var(--u)*5);left:50%;margin-left:calc(var(--u)*-6);border-bottom-width:0;border-top-color:#d3e3ff}
.ar.l{left:calc(var(--u)*5);top:50%;margin-top:calc(var(--u)*-6);border-left-width:0;border-right-color:#d3e3ff}
.ar.r{right:calc(var(--u)*5);top:50%;margin-top:calc(var(--u)*-6);border-right-width:0;border-left-color:#d3e3ff}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--u)*50);height:calc(var(--u)*50);margin:calc(var(--u)*-25) 0 0 calc(var(--u)*-25);border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff,#a9c4ff 38%,#4c72e6 100%);
  box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 16px rgba(120,170,255,.55);will-change:transform}
#joy.on .disc{border-color:rgba(190,215,255,.8)}

.act{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;font-weight:800;line-height:1;border:2px solid rgba(255,255,255,.55);text-shadow:0 1px 3px rgba(0,0,0,.5);
  transition:transform .06s,filter .15s,opacity .15s}
.act::after{content:"";position:absolute;inset:calc(var(--u)*-10);border-radius:50%}
.act::before{content:"";position:absolute;inset:calc(var(--u)*-7);border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--rc,#fff) calc(var(--p,0)*1turn),rgba(255,255,255,.14) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.act .lbl{font-size:calc(var(--u)*30);letter-spacing:.02em}
.act small{font-size:calc(var(--u)*11);margin-top:calc(var(--u)*3);font-weight:700;opacity:.92}
.act.press{transform:scale(.93);filter:brightness(1.2)}
#btnA{right:calc(var(--u)*16 + env(safe-area-inset-right,0px));bottom:calc(var(--u)*22 + env(safe-area-inset-bottom,0px));
  width:calc(var(--u)*90);height:calc(var(--u)*90);--rc:#ffd24a;
  background:radial-gradient(circle at 36% 28%,#ffa98a,#ff4a5c 55%,#9c1236);box-shadow:0 5px 18px rgba(255,60,90,.4),inset 0 -6px 14px rgba(0,0,0,.28)}
#btnA.locked{--rc:#ffd24a;--p:1;background:radial-gradient(circle at 36% 28%,#ffe28a,#ff9d2e 55%,#a85200);
  box-shadow:0 0 26px rgba(255,200,60,.75),inset 0 -6px 14px rgba(0,0,0,.25);animation:lockpulse 1s ease-in-out infinite}
@keyframes lockpulse{50%{box-shadow:0 0 38px rgba(255,210,80,.95),inset 0 -6px 14px rgba(0,0,0,.25)}}
#btnB{right:calc(var(--u)*108 + env(safe-area-inset-right,0px));bottom:calc(var(--u)*92 + env(safe-area-inset-bottom,0px));
  width:calc(var(--u)*64);height:calc(var(--u)*64);--rc:#6fe3ff;
  background:radial-gradient(circle at 36% 28%,#a5eaff,#3b8cff 55%,#1a3a9e);box-shadow:0 4px 14px rgba(60,140,255,.35),inset 0 -5px 12px rgba(0,0,0,.28)}
#btnB .lbl{font-size:calc(var(--u)*24)}
#btnB small{font-size:calc(var(--u)*10)}
#btnB.ready{--rc:#fff;animation:readypulse .9s ease-in-out infinite}
@keyframes readypulse{50%{box-shadow:0 0 30px rgba(120,230,255,.95),inset 0 -5px 12px rgba(0,0,0,.28);transform:scale(1.07)}}
#btnB.ready.press{animation:none}
#btnB.od{--rc:#ff7a3a;background:radial-gradient(circle at 36% 28%,#ffc38a,#ff6a2e 55%,#8f2200)}
.act.dim{opacity:.38;filter:grayscale(.7)}
#btnB.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- 菜单浮层 ---------- */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
  background:rgba(2,4,14,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);touch-action:pan-y}
.overlay.show{display:flex}
.card{width:calc(var(--u)*308);max-width:94%;max-height:96%;overflow:auto;padding:calc(var(--u)*22) calc(var(--u)*18) calc(var(--u)*16);
  border-radius:calc(var(--u)*22);text-align:center;background:linear-gradient(160deg,rgba(26,38,84,.93),rgba(9,13,36,.95));
  border:1px solid rgba(130,170,255,.3);box-shadow:0 12px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
.card h1,.card h2{margin:0;font-weight:900;letter-spacing:.1em;background:linear-gradient(180deg,#fff,#9ccaff 55%,#6283ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(90,140,255,.5))}
.card h1{font-size:calc(var(--u)*42)}
.card h2{font-size:calc(var(--u)*30)}
.eng{margin:calc(var(--u)*2) 0 calc(var(--u)*14);font-size:calc(var(--u)*12);letter-spacing:.42em;color:#7f9bd6;font-weight:700}
.btn{display:block;width:100%;margin:calc(var(--u)*10) 0 0;padding:calc(var(--u)*13) 0;border-radius:calc(var(--u)*14);
  font-weight:800;font-size:calc(var(--u)*17);letter-spacing:.08em;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);touch-action:manipulation}
.btn.primary{background:linear-gradient(180deg,#ff9a62,#ff3d6e);border:0;box-shadow:0 6px 20px rgba(255,70,110,.4)}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.sm{padding:calc(var(--u)*10) 0;font-size:calc(var(--u)*14)}
.row{display:flex;gap:calc(var(--u)*10)}
.tips{list-style:none;margin:calc(var(--u)*16) 0 0;padding:calc(var(--u)*12) calc(var(--u)*12);text-align:left;font-size:calc(var(--u)*12.5);line-height:1.7;
  color:#aebfe6;background:rgba(255,255,255,.05);border-radius:calc(var(--u)*12)}
.tips b{color:#ffd24a}
.tips li.soul b{color:#8ff0ff}
.best{margin-top:calc(var(--u)*12);font-size:calc(var(--u)*13);color:#9fb4e6}
.best b{color:#ffd24a;font-size:calc(var(--u)*16)}
.big{font-size:calc(var(--u)*46);font-weight:900;color:#fff;margin:calc(var(--u)*6) 0 0;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(120,170,255,.6)}
.lbls{font-size:calc(var(--u)*12);color:#8fa7dd;letter-spacing:.2em}
.wave{color:#c3d3f5;font-size:calc(var(--u)*14);margin-top:calc(var(--u)*2)}
.badge{display:inline-block;margin-top:calc(var(--u)*8);padding:calc(var(--u)*3) calc(var(--u)*12);border-radius:99px;font-weight:800;font-size:calc(var(--u)*13);
  color:#2b1a00;background:linear-gradient(90deg,#ffd24a,#ff9d2e);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
ol.list{list-style:none;margin:calc(var(--u)*12) 0 0;padding:0;text-align:left;font-size:calc(var(--u)*13.5)}
ol.list li{display:grid;grid-template-columns:calc(var(--u)*26) 1fr auto calc(var(--u)*70);align-items:center;gap:calc(var(--u)*6);
  padding:calc(var(--u)*7) calc(var(--u)*8);border-radius:calc(var(--u)*9);color:#c7d6f6}
ol.list li:nth-child(odd){background:rgba(255,255,255,.045)}
ol.list li b{color:#7f9bd6;font-weight:800;text-align:center}
ol.list li:nth-child(1) b{color:#ffd24a}ol.list li:nth-child(2) b{color:#d6dde8}ol.list li:nth-child(3) b{color:#e8a56a}
ol.list .sc{font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
ol.list .wv{font-size:calc(var(--u)*11.5);color:#9fb4e6}
ol.list .dt{font-size:calc(var(--u)*10.5);color:#6f86bd;text-align:right}
ol.list li.me{background:linear-gradient(90deg,rgba(255,210,74,.28),rgba(255,120,60,.14));outline:1px solid rgba(255,210,74,.6)}
ol.list li.empty{display:block;text-align:center;color:#7f93c4;padding:calc(var(--u)*18)}
.hint{font-size:calc(var(--u)*11);color:#6f86bd;margin-top:calc(var(--u)*10)}
</style>
</head>
<body>
<div id="game" data-state="menu">
  <canvas id="c"></canvas>
  <div id="safeProbe"></div>

  <button id="pauseBtn" aria-label="暂停"><i></i><i></i></button>

  <div id="controls">
    <div id="joy" aria-label="方向圆盘">
      <div class="disc"><span class="ar u"></span><span class="ar d"></span><span class="ar l"></span><span class="ar r"></span><div id="knob"></div></div>
    </div>
    <div id="btnB" class="act" aria-label="特殊技能 B"><span class="lbl">B</span><small>星爆</small></div>
    <div id="btnA" class="act" aria-label="射击 A"><span class="lbl">A</span><small>射击</small></div>
  </div>

  <!-- 主菜单 -->
  <div id="menu" class="overlay show">
    <div class="card">
      <h1>星际突击</h1>
      <div class="eng">STAR RAID</div>
      <button class="btn primary" id="startBtn">开始游戏</button>
      <button class="btn" id="menuScoresBtn">高分榜</button>
      <div class="best">最高分 <b id="menuBest">0</b></div>
      <ul class="tips">
        <li><b>左下圆盘</b>　移动飞机</li>
        <li><b>A</b>　射击；<b>长按</b>锁定连发，<b>再按</b>解除</li>
        <li><b>B</b>　能量满后释放「星爆」冲击波</li>
        <li class="soul"><b>阵亡</b>　化为灵魂，撞向敌机即可<b>夺舍</b>，获得它的速射技能</li>
      </ul>
    </div>
  </div>

  <!-- 暂停菜单 -->
  <div id="pause" class="overlay">
    <div class="card">
      <h2>游戏暂停</h2>
      <div class="eng">PAUSED</div>
      <button class="btn primary" id="resumeBtn">继续游戏</button>
      <button class="btn" id="restartBtn">重新开始</button>
      <button class="btn" id="pauseScoresBtn">高分榜</button>
      <div class="row">
        <button class="btn sm" id="muteBtn">音效：开</button>
        <button class="btn sm" id="quitBtn">返回主菜单</button>
      </div>
    </div>
  </div>

  <!-- 高分榜 -->
  <div id="scores" class="overlay">
    <div class="card">
      <h2>高分榜</h2>
      <div class="eng">HIGH SCORES</div>
      <ol class="list" id="scoreList"></ol>
      <button class="btn primary" id="scoresBack">返回</button>
      <button class="btn sm" id="scoresClear">清空记录</button>
    </div>
  </div>

  <!-- 游戏结束 -->
  <div id="over" class="overlay">
    <div class="card">
      <h2>任务失败</h2>
      <div class="eng">GAME OVER</div>
      <div class="lbls">本局得分</div>
      <div class="big" id="overScore">0</div>
      <div class="wave" id="overWave"></div>
      <div id="overBadge"></div>
      <ol class="list" id="overList"></ol>
      <button class="btn primary" id="againBtn">再来一局</button>
      <div class="row">
        <button class="btn sm" id="overScoresBtn">完整榜单</button>
        <button class="btn sm" id="overMenuBtn">主菜单</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
 *  基础工具
 * ===================================================================== */
const W = 360;                         // 逻辑宽度（高度按屏幕比例自适应）
let H = 640, scale = 1, dpr = 1, safeTop = 0;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = id => document.getElementById(id);
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif';

const gameEl = $('game'), canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false });
const joyEl = $('joy'), knobEl = $('knob'), btnA = $('btnA'), btnB = $('btnB');

/* =====================================================================
 *  音效（WebAudio 合成，无需外部资源）
 * ===================================================================== */
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null, muted = false;
  const last = {};
  try { muted = localStorage.getItem('starraid.mute') === '1'; } catch (e) {}
  const gap = { shoot: 55, eshoot: 90, boom: 45, hit: 60, bigboom: 120 };

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function tone(f0, f1, dur, type, vol, delay) {
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, f0, f1, delay) {
    const t = ac.currentTime + (delay || 0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  }
  const defs = {
    shoot:   () => tone(900, 360, 0.07, 'square', 0.03),
    eshoot:  () => tone(320, 150, 0.1, 'sawtooth', 0.028),
    boom:    () => { noise(0.3, 0.22, 1800, 100); tone(130, 40, 0.28, 'sine', 0.18); },
    bigboom: () => { noise(0.8, 0.34, 2400, 60); tone(90, 28, 0.7, 'sine', 0.3); },
    hit:     () => tone(260, 120, 0.06, 'square', 0.03),
    hurt:    () => { tone(240, 50, 0.35, 'sawtooth', 0.13); noise(0.2, 0.18, 1400, 160); },
    pickup:  () => { tone(660, 660, 0.09, 'triangle', 0.08); tone(880, 880, 0.09, 'triangle', 0.08, 0.07); tone(1175, 1175, 0.14, 'triangle', 0.08, 0.14); },
    shield:  () => tone(300, 950, 0.25, 'sine', 0.1),
    nova:    () => { noise(0.7, 0.3, 4200, 200); tone(180, 1300, 0.55, 'sawtooth', 0.07); },
    deny:    () => tone(190, 130, 0.14, 'square', 0.05),
    lock:    () => { tone(600, 900, 0.08, 'triangle', 0.09); tone(900, 1300, 0.1, 'triangle', 0.09, 0.08); },
    unlock:  () => { tone(1100, 700, 0.08, 'triangle', 0.08); tone(700, 450, 0.1, 'triangle', 0.08, 0.08); },
    soul:    () => { tone(520, 90, 1.1, 'sine', 0.17); tone(530, 95, 1.1, 'sine', 0.1); noise(0.5, 0.1, 3000, 200); },
    possess: () => { tone(200, 950, 0.5, 'sine', 0.16); tone(420, 1900, 0.4, 'triangle', 0.07); noise(0.3, 0.1, 3200, 500); },
    revive:  () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.09, i * 0.08)); },
    wave:    () => { tone(523, 523, 0.12, 'triangle', 0.07); tone(784, 784, 0.2, 'triangle', 0.07, 0.1); },
    boss:    () => { tone(110, 70, 0.9, 'sawtooth', 0.12); tone(112, 72, 0.9, 'sawtooth', 0.08); },
    over:    () => { tone(440, 90, 1.3, 'sawtooth', 0.11); noise(0.6, 0.15, 1200, 80); },
    click:   () => tone(720, 720, 0.04, 'square', 0.03)
  };
  return {
    init,
    play(n) {
      if (!ac || muted) return;
      const now = performance.now();
      if (now - (last[n] || 0) < (gap[n] || 0)) return;
      last[n] = now;
      try { defs[n] && defs[n](); } catch (e) {}
    },
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('starraid.mute', muted ? '1' : '0'); } catch (e) {} return muted; }
  };
})();
const vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* =====================================================================
 *  高分榜（localStorage，失败时退化为内存）
 * ===================================================================== */
const SC_KEY = 'starraid.scores.v1';
let scores = [];
try {
  const a = JSON.parse(localStorage.getItem(SC_KEY) || '[]');
  if (Array.isArray(a)) scores = a.filter(x => x && typeof x.s === 'number' && typeof x.w === 'number').slice(0, 10);
} catch (e) {}
const saveScores = () => { try { localStorage.setItem(SC_KEY, JSON.stringify(scores)); } catch (e) {} };
const bestScore = () => scores.length ? scores[0].s : 0;
function submitScore(s, w) {
  if (s <= 0) return { entry: null, rank: -1 };
  const entry = { s, w, d: Date.now() };
  scores.push(entry);
  scores.sort((a, b) => b.s - a.s || a.d - b.d);
  scores = scores.slice(0, 10);
  saveScores();
  return { entry, rank: scores.indexOf(entry) };
}
const pad2 = n => String(n).padStart(2, '0');

const SS = 3;
function mk(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS);
  const g = c.getContext('2d');
  g.scale(SS, SS); g.translate(w / 2, h / 2);
  fn(g);
  return { c, w, h };
}
function mirror(r) { const o = r.slice(); for (let i = r.length - 1; i >= 0; i--) o.push([-r[i][0], r[i][1]]); return o; }
function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function vgrad(g, y0, y1, c0, c1, c2) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c0); if (c2) gr.addColorStop(.5, c2); gr.addColorStop(1, c1); return gr;
}
function fillStroke(g, pts, fill, stroke, lw) {
  poly(g, pts); g.fillStyle = fill; g.fill();
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.lineJoin = 'round'; g.stroke(); }
}
function heartPath(g, x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * .95);
  g.bezierCurveTo(x - s * 1.6, y - s * .1, x - s * .95, y - s * 1.35, x, y - s * .45);
  g.bezierCurveTo(x + s * .95, y - s * 1.35, x + s * 1.6, y - s * .1, x, y + s * .95);
  g.closePath();
}

const glowCache = {};
function glow(rgb) {
  if (glowCache[rgb]) return glowCache[rgb];
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(' + rgb + ',1)'); gr.addColorStop(.25, 'rgba(' + rgb + ',.55)');
  gr.addColorStop(.6, 'rgba(' + rgb + ',.12)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return glowCache[rgb] = c;
}

function buildNebula() {
  nebula = document.createElement('canvas');
  const nw = Math.ceil(W / 3), nh = Math.ceil(H / 3);
  nebula.width = nw; nebula.height = nh;
  const g = nebula.getContext('2d'); g.scale(nw / W, nh / H);   // 精确映射，上下无缝平铺
  g.fillStyle = '#04050f'; g.fillRect(0, 0, W, H);
  const cols = ['110,60,200', '40,90,220', '30,160,190', '190,60,150'];
  for (let i = 0; i < 7; i++) {
    const x = rand(0, W), y = rand(0, H), r = rand(110, 230), c = pick(cols);
    for (const oy of [-H, 0, H]) {
      const gr = g.createRadialGradient(x, y + oy, 0, x, y + oy, r);
      gr.addColorStop(0, 'rgba(' + c + ',.2)'); gr.addColorStop(1, 'rgba(' + c + ',0)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
  }
}
function buildStars() {
  stars = STAR_LAYERS.map(L => Array.from({ length: L.n }, () => ({ x: rand(0, W), y: rand(0, H), c: pick(STAR_COLORS), tw: rand(0, TAU) })));
}
function updateBg(dt) {
  bgMul = lerp(bgMul, bgMulT, 1 - Math.exp(-dt * 3));
  const target = state === 'playing' || state === 'paused' || state === 'over' ? clamp((P.x - W / 2) / (W / 2), -1, 1) : 0;
  camS = lerp(camS, target, 1 - Math.exp(-dt * 4));
  nebY = (nebY + 8 * bgMul * dt) % H;
  STAR_LAYERS.forEach((L, i) => {
    const arr = stars[i], d = L.spd * bgMul * dt;
    for (const s of arr) { s.y += d; if (s.y > H + 4) { s.y -= H + 8; s.x = rand(0, W); } }
  });
  if (planet) { planet.y += 9 * bgMul * dt; if (planet.y > H + 110) planet = null; }
  else if ((planetCd -= dt) <= 0) {
    planet = { spr: pick(planetSprs), x: rand(40, W - 40), y: -100, s: rand(.8, 1.5) };
    planetCd = rand(14, 28);
  }
}
function drawBg(t) {
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = 1;
  ctx.drawImage(nebula, 0, nebY, W, H);
  ctx.drawImage(nebula, 0, nebY - H, W, H);
  if (planet) {
    const px = planet.x - camS * 6, sz = 150 * planet.s;
    ctx.drawImage(planet.spr.c, px - sz / 2, planet.y - sz / 2, sz, sz);
  }
  STAR_LAYERS.forEach((L, i) => {
    const px = camS * L.par;
    for (const s of stars[i]) {
      let x = (s.x - px) % W; if (x < 0) x += W;
      ctx.globalAlpha = L.alpha * (.65 + .35 * Math.sin(t * 2.2 + s.tw));
      ctx.fillStyle = s.c;
      if (L.streak) ctx.fillRect(x, s.y, L.size, L.size + 6 * bgMul);
      else ctx.fillRect(x, s.y, L.size, L.size);
    }
  });
  ctx.globalAlpha = 1;
}

function updateJoy(e) {
  const r = knobEl.parentElement.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const R = r.width * 0.5 * 0.55;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const m = Math.hypot(dx, dy);
  if (m > R) { dx = dx / m * R; dy = dy / m * R; }
  knobEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  let nx = dx / R, ny = dy / R;
  const mag = Math.hypot(nx, ny), dead = .1;
  if (mag < dead) { nx = ny = 0; }
  else { const k = (mag - dead) / (1 - dead) / mag; nx *= k; ny *= k; }
  input.jx = nx; input.jy = ny;
}
function releaseJoy() {
  joyId = null; input.jx = input.jy = 0; knobEl.style.transform = ''; joyEl.classList.remove('on');

/* =====================================================================
 *  生成：敌波
 * ===================================================================== */
function buildWave(n) {
  const q = [];
  const side = () => Math.random() < .5 ? -1 : 1;
  const bossWave = n % 5 === 0;
  const pat = {
    stream(t, type) {
      const s = side(), cnt = clamp(5 + Math.floor(n / 3), 5, 9), om = rand(.55, .9), y0 = rand(50, 100), sp = rand(165, 185);
      for (let i = 0; i < cnt; i++) q.push({ t: t + i * .3, type, x: s < 0 ? -24 : W + 24, y: y0, ai: 'arc', th: s < 0 ? .3 : Math.PI - .3, om: s < 0 ? om : -om, sp });
      return cnt * .3 + 2.6;
    },
    line(t, type) {
      const cnt = clamp(4 + Math.floor(n / 4), 4, 7), vy = rand(78, 92);
      for (let i = 0; i < cnt; i++) { const x = 40 + (W - 80) * i / (cnt - 1); q.push({ t, type, x, y: -30, ai: 'sine', vy, amp: 34, f: 1.2, ph: 0 }); }
      return 4;
    },
    vee(t, type) {
      const rows = clamp(3 + Math.floor(n / 5), 3, 5);
      for (let r = 0; r < rows; r++) for (const s of (r ? [-1, 1] : [0])) q.push({ t: t + r * .35, type, x: W / 2 + s * r * 38, y: -30, ai: 'sine', vy: 82, amp: 56, f: .9, ph: 0 });
      return 4.5;
    },
    hover(t, type, cnt) {
      for (let i = 0; i < cnt; i++) q.push({ t: t + i * .5, type, x: W * (i + 1) / (cnt + 1), y: -40, ai: 'hover', ty: 90 + (i % 2) * 60 + rand(0, 30), amp: 58, hoverT: rand(6, 8) });
      return 6;
    },
    dive(t) {
      const cnt = clamp(3 + Math.floor(n / 3), 3, 7);
      for (let i = 0; i < cnt; i++) q.push({ t: t + i * .85, type: 3, x: rand(30, W - 30), y: -30, ai: 'dive', ty: rand(70, 150) });
      return cnt * .85 + 2.5;
    }
  };
  let t = .4;
  if (bossWave) {
    q.push({ t: 1, type: 4, x: W / 2, y: -90, ai: 'boss' });
    pat.stream(6, 0); pat.stream(16, 1);
    if (n >= 10) pat.dive(11);
  } else {
    const groups = n < 3 ? 2 : n < 7 ? 3 : 4;
    const pool = [() => pat.stream(t, n >= 6 && Math.random() < .4 ? 1 : 0), () => pat.line(t, 0)];
    if (n >= 2) pool.push(() => pat.vee(t, 1), () => pat.stream(t, 1));
    if (n >= 3) pool.push(() => pat.dive(t), () => pat.hover(t, 1, 2));
    if (n >= 4) pool.push(() => pat.hover(t, 2, n >= 9 ? 2 : 1));
    let lastIdx = -1;
    for (let i = 0; i < groups; i++) {
      let idx; do { idx = randi(0, pool.length - 1); } while (idx === lastIdx && pool.length > 1);
      lastIdx = idx;
      t += pool[idx]() * (i === groups - 1 ? 0 : .8);
    }
  }
  q.sort((a, b) => a.t - b.t);
  return q;
}

/* =====================================================================
 *  更新
 * ===================================================================== */
const minY = () => safeTop + 112;
const maxY = () => H - 124;

function updatePlayer(dt) {
  if (P.mode === 'dead') return;
  // 方向输入（圆盘模拟量 + 键盘）
  let ix = input.jx + input.kx, iy = input.jy + input.ky;
  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }
  let sp = BASE_SPEED * (P.speedT > 0 ? 1.5 : 1);
  if (P.mode === 'soul') sp = BASE_SPEED * 1.3;
  else if (P.mode === 'possessed') sp *= SKILL[P.ghost.type].move;
  // 指数平滑：起步/刹车都带惯性，手感顺滑
  const k = 1 - Math.exp(-dt * (mag > .02 ? 13 : 9));
  P.vx += (ix * sp - P.vx) * k; P.vy += (iy * sp - P.vy) * k;
  // 灵魂：轻微吸附最近的可夺舍敌机，方便触屏对准
  if (P.mode === 'soul') {
    let best = null, bd = 90;
    for (const e of enemies) { if (e.dead || e.type === 4 || e.y < 0) continue; const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < bd) { bd = d; best = e; } }
    if (best) { const pull = (1 - bd / 90) * 360 * dt, a = Math.atan2(best.y - P.y, best.x - P.x); P.vx += Math.cos(a) * pull; P.vy += Math.sin(a) * pull; }
  }
  P.x = clamp(P.x + P.vx * dt, 26, W - 26);
  P.y = clamp(P.y + P.vy * dt, minY(), maxY());
  P.tilt = lerp(P.tilt, clamp(P.vx / (BASE_SPEED * 1.2), -1, 1), 1 - Math.exp(-dt * 12));

  P.inv = Math.max(0, P.inv - dt); P.shield = Math.max(0, P.shield - dt);
  P.speedT = Math.max(0, P.speedT - dt); P.od = Math.max(0, P.od - dt); P.muz = Math.max(0, P.muz - dt);
  if (P.mode !== 'soul') P.energy = Math.min(100, P.energy + dt * 3.4);

  // 魂能
  if (P.mode === 'soul' || P.mode === 'possessed') {
    const rate = P.mode === 'soul' ? (enemies.length ? 11 : 3.5) : 4;
    P.soulE -= rate * dt;
    if (P.soulE <= 0) { P.soulE = 0; endGame(); return; }
  }
  // 速度提升：尾迹
  if (P.speedT > 0 && P.mode !== 'soul' && (P.trailT -= dt) <= 0) {
    P.trailT = .03;
    particles.push({ x: P.x - 8, y: P.y + 22, vx: 0, vy: 140, life: 0, max: .32, size: 6, rgb: '255,220,90', drag: 0 });
    particles.push({ x: P.x + 8, y: P.y + 22, vx: 0, vy: 140, life: 0, max: .32, size: 6, rgb: '255,220,90', drag: 0 });
  }
  if (P.mode === 'soul' && (P.wispT -= dt) <= 0) {
    P.wispT = .035;
    particles.push({ x: P.x + rand(-6, 6), y: P.y + 12, vx: rand(-12, 12), vy: rand(30, 70), life: 0, max: .55, size: rand(5, 9), rgb: '150,230,255', drag: .5 });
  }

  // 夺舍判定
  if (P.mode === 'soul') {
    for (const e of enemies) {
      if (e.dead || e.y < 4) continue;
      const d = Math.hypot(e.x - P.x, e.y - P.y);
      if (d < e.r + 13) {
        if (e.type === 4) { if ((e.noticeT = (e.noticeT || 0) - dt) <= 0) { popup(P.x, P.y - 26, '无法夺舍 BOSS', '#ff9ab0', 12); e.noticeT = 1.2; } continue; }
        possess(e); break;
      }
    }
  }

  // 射击
  P.fireCd -= dt;
  if (fireHeld() && P.fireCd <= 0 && (P.mode === 'ship' || P.mode === 'possessed')) playerFire();
}

function playerFire() {
  const boost = (P.speedT > 0 ? 1.25 : 1);
  if (P.mode === 'ship') {
    const pat = SHOTS[P.weapon];
    P.fireCd = .17 / boost;
    for (const s of pat) {
      const a = s[1] * Math.PI / 180;

  if (frac > 0) { ctx.save(); rr(x, y, w, 17, 8.5); ctx.clip(); ctx.fillStyle = 'rgba(' + rgb + ',.4)'; ctx.fillRect(x, y, w * frac, 17); ctx.restore(); }
  ctx.strokeStyle = 'rgba(' + rgb + ',.85)'; ctx.lineWidth = 1; rr(x, y, w, 17, 8.5); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '700 10.5px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x + w / 2, y + 9);
}
function drawHUD(t) {
  const x0 = 14, y0 = safeTop + 12;
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = '700 10px ' + FONT; ctx.fillStyle = 'rgba(170,200,255,.75)'; ctx.fillText('SCORE', x0, y0);
  ctx.font = '800 24px ' + FONT; ctx.fillStyle = '#fff'; ctx.fillText(String(score).padStart(6, '0'), x0, y0 + 10);
  ctx.textAlign = 'right';
  ctx.font = '700 10px ' + FONT; ctx.fillStyle = 'rgba(170,200,255,.75)'; ctx.fillText('BEST ' + Math.max(bestScore(), score), W - 62, y0 + 2);
  ctx.font = '800 15px ' + FONT; ctx.fillStyle = '#ffd24a'; ctx.fillText('第 ' + Math.max(1, wave) + ' 波', W - 62, y0 + 16);

  const y1 = y0 + 42;
  ctx.textAlign = 'left';
  if (P.mode === 'ship' || P.mode === 'dead') {
    for (let i = 0; i < MAX_LIVES; i++) {
      heartPath(ctx, x0 + 8 + i * 22, y1 + 8, 7.5);
      if (i < P.lives) { ctx.fillStyle = '#ff5577'; ctx.fill(); ctx.strokeStyle = '#ffc0cf'; ctx.lineWidth = 1; ctx.stroke(); }
      else { ctx.strokeStyle = 'rgba(255,150,170,.35)'; ctx.lineWidth = 1.2; ctx.stroke(); }
    }
  } else {   // 灵魂 / 夺舍：魂能条
    ctx.fillStyle = '#8ff0ff'; ctx.font = '800 12px ' + FONT; ctx.fillText('魂能', x0, y1 + 2);
    const bx = x0 + 34, bw = 150, f = clamp(P.soulE / 100, 0, 1);
    ctx.fillStyle = 'rgba(8,14,40,.65)'; rr(bx, y1 + 2, bw, 11, 5.5); ctx.fill();
    ctx.save(); rr(bx, y1 + 2, bw, 11, 5.5); ctx.clip();
    const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0); gr.addColorStop(0, f < .25 ? '#ff6a8a' : '#4fc3ff'); gr.addColorStop(1, f < .25 ? '#ff9a6a' : '#9ff4ff');
    ctx.fillStyle = gr; ctx.fillRect(bx, y1 + 2, bw * f, 11);
    if (f < .25) { ctx.fillStyle = 'rgba(255,255,255,' + (.2 + .2 * Math.sin(t * 14)) + ')'; ctx.fillRect(bx, y1 + 2, bw * f, 11); }
    ctx.restore();
    ctx.strokeStyle = 'rgba(160,230,255,.7)'; ctx.lineWidth = 1; rr(bx, y1 + 2, bw, 11, 5.5); ctx.stroke();
    if (P.mode === 'possessed') { ctx.fillStyle = '#d6f8ff'; ctx.font = '700 11px ' + FONT; ctx.fillText(SKILL[P.ghost.type].name, bx + bw + 8, y1 + 2); }
  }
  // 状态药丸
  let px = x0; const y2 = y1 + 26;
  if (P.mode === 'ship') { pill(px, y2, 62, '火力 Lv' + P.weapon, P.weapon / 5, '90,200,255'); px += 68; }
  else if (P.mode === 'possessed' && P.extra > 0) { pill(px, y2, 62, '弹幕 +' + P.extra, P.extra / 2, '90,200,255'); px += 68; }
  if (P.shield > 0) { pill(px, y2, 62, '护盾 ' + Math.ceil(P.shield) + 's', P.shield / 10, '90,255,160'); px += 68; }
  if (P.speedT > 0) { pill(px, y2, 62, '加速 ' + Math.ceil(P.speedT) + 's', P.speedT / 10, '255,215,80'); px += 68; }
  if (P.od > 0) { pill(px, y2, 62, '超载 ' + Math.ceil(P.od) + 's', P.od / 4, '255,130,60'); px += 68; }
  // Boss 血条
  const boss = enemies.find(e => e.type === 4 && !e.dead);
  if (boss) {
    const bw = W - 28, by = y2 + 40, f = clamp(boss.hp / boss.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(8,14,40,.65)'; rr(x0, by, bw, 9, 4.5); ctx.fill();
    ctx.save(); rr(x0, by, bw, 9, 4.5); ctx.clip();
    const gr = ctx.createLinearGradient(x0, 0, x0 + bw, 0); gr.addColorStop(0, '#ff3d6e'); gr.addColorStop(1, '#ff9a5a');
    ctx.fillStyle = gr; ctx.fillRect(x0, by, bw * f, 9); ctx.restore();
    ctx.strokeStyle = 'rgba(255,140,170,.8)'; ctx.lineWidth = 1; rr(x0, by, bw, 9, 4.5); ctx.stroke();
    ctx.fillStyle = '#ffd0da'; ctx.font = '800 9px ' + FONT; ctx.textAlign = 'left'; ctx.fillText('BOSS', x0 + 6, by - 11);
  }
}

let vigGrad = null, vigKey = '';
function drawOverlays(t) {
  // 灵魂 / 夺舍：冷色调与暗角
  if (P.mode === 'soul' || P.mode === 'possessed') {
    const soul = P.mode === 'soul';
    ctx.fillStyle = soul ? 'rgba(40,90,190,.14)' : 'rgba(40,120,200,.06)'; ctx.fillRect(0, 0, W, H);
    const key = W + 'x' + H;
    if (key !== vigKey) { vigGrad = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .7); vigGrad.addColorStop(0, 'rgba(80,200,255,0)'); vigGrad.addColorStop(1, 'rgba(80,200,255,.3)'); vigKey = key; }
    ctx.globalAlpha = soul ? .9 + Math.sin(t * 3) * .1 : .55; ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
  if (hurtFlash > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .7);
    g.addColorStop(0, 'rgba(255,40,70,0)'); g.addColorStop(1, 'rgba(255,40,70,' + (hurtFlash * .8) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (whiteFlash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + clamp(whiteFlash * .55, 0, .5) + ')'; ctx.fillRect(0, 0, W, H); }
  if (banner) {
    const k = banner.t / banner.dur, a = k < .12 ? k / .12 : k > .8 ? 1 - (k - .8) / .2 : 1;
    const sc = 1 + (1 - Math.min(1, banner.t / .25)) * .35;
    ctx.save(); ctx.translate(W / 2, H * .34); ctx.scale(sc, sc); ctx.globalAlpha = clamp(a, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 36px ' + FONT; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,20,.6)'; ctx.strokeText(banner.title, 0, 0);
    ctx.fillStyle = banner.col; ctx.fillText(banner.title, 0, 0);
    if (banner.sub) { ctx.font = '700 15px ' + FONT; ctx.lineWidth = 3; ctx.strokeText(banner.sub, 0, 34); ctx.fillStyle = '#fff'; ctx.fillText(banner.sub, 0, 34); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (state === 'playing' && resumeT > 0) {
    ctx.fillStyle = 'rgba(0,0,10,.35)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = '900 84px ' + FONT;
    const n = Math.ceil(resumeT / .5), f = (resumeT / .5) % 1;
    ctx.globalAlpha = .4 + .6 * (1 - f); ctx.fillText(String(n), W / 2, H * .4); ctx.globalAlpha = 1;
  }
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04050f'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const k = dpr * scale, sx = shake > 0 ? rand(-shake, shake) : 0, sy = shake > 0 ? rand(-shake, shake) : 0;
  ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
  drawBg(t);
  if (state === 'menu') return;
  drawPowerups(t); drawEnemies(t); drawBullets(); drawPlayer(t); drawFx();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawOverlays(t);
  drawHUD(t);
}

/* =====================================================================
 *  控件 UI 同步
 * ===================================================================== */
let uiB = -1, uiA = -1, uiAT = '', uiBT = '';
function updateControlsUI() {
  const soul = P.mode === 'soul';
  const q = Math.round((soul ? 0 : P.energy) / 100 * 100);
  if (q !== uiB) { btnB.style.setProperty('--p', q / 100); uiB = q; }
  btnB.classList.toggle('ready', !soul && P.energy >= 100 && P.mode !== 'dead');
  btnB.classList.toggle('dim', soul);
  btnB.classList.toggle('od', P.mode === 'possessed');
  const bt = P.mode === 'possessed' ? '超载' : '星爆';
  if (bt !== uiBT) { btnB.querySelector('small').textContent = bt; uiBT = bt; }
  let ap = 0;
  if (input.aLock) ap = 1; else if (input.aDown && !input.aIgnore) ap = clamp((performance.now() - input.aPressT) / LOCK_MS, 0, 1);
  const aq = Math.round(ap * 50);
  if (aq !== uiA) { btnA.style.setProperty('--p', aq / 50); uiA = aq; }
  btnA.classList.toggle('locked', input.aLock);
  btnA.classList.toggle('dim', soul);
  const at = input.aLock ? '锁定' : '射击';
  if (at !== uiAT) { btnA.querySelector('small').textContent = at; uiAT = at; }
}

/* =====================================================================
 *  流程 / 菜单
 * ===================================================================== */
function setState(s) { state = s; gameEl.dataset.state = s; }
function showOverlay(id) { document.querySelectorAll('.overlay').forEach(o => o.classList.toggle('show', o.id === id)); }

function resetWorld() {
  bullets.length = ebullets.length = enemies.length = powerups.length = particles.length = rings.length = popups.length = novas.length = later.length = 0;
  score = 0; wave = 0; kills = 0; gameTime = 0; pity = 0; queue = []; waveState = 'pause'; waveT = 1.2; waveTime = 0;
  shake = hurtFlash = whiteFlash = 0; banner = null; resumeT = 0;
  Object.assign(P, { x: W / 2, y: H - 190, vx: 0, vy: 0, tilt: 0, mode: 'ship', lives: 3, weapon: 1, extra: 0, shield: 0, speedT: 0, inv: 1.5,
    fireCd: 0, energy: 25, od: 0, ghost: null, soulE: 100, muz: 0, muzList: SHOTS[1], trailT: 0, wispT: 0 });
  input.aLock = false; input.aIgnore = false;
  showBanner('第 1 波', '准备出击', '#ffd24a', 1.8);
}
function startGame() {
  Sfx.init(); Sfx.play('click');
  releaseInputs(); resetWorld(); setState('playing'); showOverlay(''); uiA = uiB = -1;
}
function pauseGame() {
  if (state !== 'playing') return;
  setState('paused'); releaseInputs(); $('muteBtn').textContent = '音效：' + (Sfx.muted ? '关' : '开');
  showOverlay('pause'); Sfx.play('click');
}
function resumeGame() {
  if (state !== 'paused') return;
  setState('playing'); showOverlay(''); resumeT = 1.5; lastT = performance.now(); Sfx.play('click');
}
function toMenu() {
  releaseInputs(); input.aLock = false; setState('menu'); $('menuBest').textContent = bestScore(); showOverlay('menu'); Sfx.play('click');
}
function endGame() {
  if (state !== 'playing') return;
  P.mode = 'dead'; setState('over'); releaseInputs(); input.aLock = false;
  explode(P.x, P.y, '150,230,255', 30, 280); addShake(14); Sfx.play('over'); vibrate([120, 60, 240]);
  const res = submitScore(score, Math.max(1, wave));
  setTimeout(() => {
    if (state !== 'over') return;
    $('overScore').textContent = score;
    $('overWave').textContent = '到达第 ' + Math.max(1, wave) + ' 波　·　击毁 ' + kills + ' 架';
    $('overBadge').innerHTML = res.rank === 0 ? '<span class="badge">🏆 新纪录！</span>' : (res.rank > 0 ? '<span class="badge">榜单第 ' + (res.rank + 1) + ' 名</span>' : '');
    renderScores($('overList'), 5, res.entry);
    showOverlay('over');
  }, 1300);
}
function openScores(from) {
  scoresFrom = from; renderScores($('scoreList'), 10, null); showOverlay('scores'); Sfx.play('click');
  $('scoresClear').textContent = '清空记录'; $('scoresClear').dataset.arm = '';
}

$('startBtn').onclick = startGame;
$('menuScoresBtn').onclick = () => openScores('menu');
$('pauseBtn').onclick = pauseGame;
$('resumeBtn').onclick = resumeGame;
$('restartBtn').onclick = startGame;
$('pauseScoresBtn').onclick = () => openScores('pause');
$('quitBtn').onclick = toMenu;
$('muteBtn').onclick = () => { Sfx.init(); $('muteBtn').textContent = '音效：' + (Sfx.toggle() ? '关' : '开'); Sfx.play('click'); };
$('scoresBack').onclick = () => { showOverlay(scoresFrom); Sfx.play('click'); };
$('scoresClear').onclick = function () {
  if (this.dataset.arm !== '1') { this.dataset.arm = '1'; this.textContent = '再点一次确认清空'; return; }
  scores = []; saveScores(); this.dataset.arm = ''; this.textContent = '清空记录'; renderScores($('scoreList'), 10, null); $('menuBest').textContent = 0;
};
$('againBtn').onclick = startGame;
$('overScoresBtn').onclick = () => openScores('over');
$('overMenuBtn').onclick = toMenu;

document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
addEventListener('blur', () => pauseGame());
addEventListener('contextmenu', e => e.preventDefault());
['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault()));
document.addEventListener('dblclick', e => e.preventDefault());

/* =====================================================================
 *  尺寸 / 主循环
 * ===================================================================== */
function resize() {
  const r = gameEl.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const oldH = H;
  scale = r.width / W; H = r.height / scale;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  document.documentElement.style.setProperty('--u', scale + 'px');
  safeTop = (parseFloat(getComputedStyle($('safeProbe')).paddingTop) || 0) / scale;
  if (!nebula || Math.abs(oldH - H) > 1) { buildNebula(); buildStars(); }
  P.y = clamp(P.y, 0, maxY()); vigKey = '';
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  update(dt);
  draw(now / 1000);
  if (state === 'playing') updateControlsUI();
  requestAnimationFrame(frame);
}

resize();
$('menuBest').textContent = bestScore();
requestAnimationFrame(frame);

// 调试钩子：仅在 URL 带 ?debug 时暴露
if (/[?&]debug/.test(location.search)) {
  window.__g = {
    P, input, get state() { return state; }, get score() { return score; }, get wave() { return wave; }, get H() { return H; }, get scores() { return scores; },
    enemies, bullets, ebullets, powerups, particles, spawnEnemy, spawnPowerup, startGame, pauseGame, resumeGame, enterSoul, hurtPlayer, endGame,
    setScore: v => { score = v; }, setWave: v => { wave = v; waveState = 'pause'; waveT = .1; }, killEnemy, useSkill,
    clearEnemies: () => { enemies.forEach(e => e.dead = true); queue.length = 0; }
  };
}
})();
</script>
</body>
